# Team Feedback Board: docker compose (TASK-003: database only).
# Backend and frontend services are added by TASK-007.
# No top-level "version:" key (legacy; stack.md note 10).
# All values come from .env (copy .env.example to .env first).
name: feedback-board

services:
  db:
    # Tag pinned in docs/project/stack.md (PostgreSQL 18.6).
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (cp .env.example .env)}
      # Read by db/init/01-roles.sh (restricted application role, ADR-004 section 5).
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env (cp .env.example .env)}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (cp .env.example .env)}
    volumes:
      # PostgreSQL 18+ images keep PGDATA at /var/lib/postgresql/18/docker, so the
      # volume is mounted at /var/lib/postgresql (not at .../data) per the image docs.
      - db_data:/var/lib/postgresql
      # Init scripts run only on a fresh volume (docker compose down -v first).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only: the database is never exposed on other interfaces.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 uses TCP: during first-start initialisation the image runs a
      # temporary server that listens on the unix socket only, so a socket check
      # would report "healthy" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
