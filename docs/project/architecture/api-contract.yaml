openapi: 3.0.3
info:
  title: Team Feedback Board API
  version: 1.0.0
  description: |
    Contract for the Team Feedback Board backend (FastAPI) and frontend (React).
    Status: Proposed, awaiting Orchestrator approval (TASK-001). Changing an approved
    contract needs an ADR and the Orchestrator's go-ahead.

    ## Conventions
    - Base path `/api/v1`. JSON only. Timestamps ISO 8601 UTC (`2026-10-27T18:30:00Z`). IDs are UUID strings.
    - **Tenant comes from the access token** (`org` claim, ADR-002), never from a request field.
      No request body, query or path parameter carries an organization id.
    - **Roles:** `admin` and `member`. The role of the caller is read from the database on each
      request. Each operation lists its allowed roles in `x-roles`; `x-features` links the brief's F-ids.
    - **Cross-organization access returns 404**, never 403: a post or comment that exists in another
      organization is indistinguishable from one that does not exist (`POST_NOT_FOUND`).
    - **Status codes:** 200 OK, 201 Created, 204 No Content, 400 validation error, 401 unauthenticated (**ASSUMED**: the
      brief and stories name only 403 and 404; 401 for missing/invalid token is the standard reading),
      403 forbidden (wrong role; or no organization yet, **ASSUMED**, see below), 404 not found (including
      other-organization resources), 409 conflict, 429 rate limited (approved per Orchestrator message 2026-10-27, relayed from the human).
      FastAPI's default 422 for body validation must be remapped to 400 `VALIDATION_ERROR`; no operation returns 422.
    - **Order of checks:** authentication (401), then resource lookup scoped to the caller's organization
      (404, including "exists in another organization"), then role (403). A member who targets an admin-only
      operation on a post of another organization gets 404, not 403, so existence is never revealed.
    - **Trimming:** the server trims leading/trailing whitespace of `title`, `description`, `body`, `name` before checking the length limits, so spaces-only values fail with 400 (stories F2-1, F4-1, F6-1). The same applies to `display_name` at signup: **trim leading and trailing whitespace first, then validate the length (1-80)**; the trimmed value is stored. `email` is compared case-insensitively. **The `minLength`/`maxLength` values in the schemas below describe the trimmed value**: the server validates lengths after trimming, so a client or generated validator must not reject the raw input on those keywords alone (for example `"  Ana  "` is valid).
    - **Error body** for every non-2xx: `{ "error": { "code": "STRING_CODE", "message": "...", "details": [] } }`.
    - **No pagination in the MVP** (stories F7-1 and F6-1: all matching posts / comments are returned in one
      response). Lists are wrapped as `{ "items": [...] }` so that `next_cursor` can be added later without
      breaking clients. Adding pagination is a follow-up that needs a contract version bump.
    - **Auth:** `Authorization: Bearer <access_token>` (15 min, `typ=access`). The refresh token lives in an
      HttpOnly cookie `refresh_token` (`Path=/api/v1/auth`) and is never visible to JavaScript. It is **stored
      server-side as a hash, rotated on every use, reuse-detected and revocable** (ADR-002, `refresh_tokens`
      table): each login/signup starts a new token *family* with an **absolute 7-day cap from login**; rotation
      never extends past `login time + 7 days`; reuse of a rotated or revoked token revokes the whole family;
      logout revokes the family (rotation, logout, reuse revoke and eviction are serialised per family, ADR-002, so
      a logout that answers 204 leaves no live token). After the 7 days the user must log in again.
      **At most 10 active sessions (families) per user** (ASSUMED, an architect addition): when an 11th is
      created by signup or login, the session with the oldest login time is revoked (`evicted`) and its next
      `POST /auth/refresh` answers 401, so the SPA shows the login form.
      Token verification (ADR-002): `jwt.decode(..., algorithms=["HS256"], issuer="feedback-board",
      audience="feedback-board-api", leeway=30, options={"require": ["exp", "iat", "sub", "iss", "aud", "typ", "jti"]})`
      (`leeway=30` covers only the JWT time claims, so an access token is accepted for up to 15 min 30 s; database
      expiry, the 7-day cap and the reuse leeway are exact),
      then `typ` must equal `access` on every API endpoint (a refresh token is never accepted as a bearer token)
      and `refresh` only for the cookie on `/auth/refresh` and `/auth/logout`. `org` is **not** in the required list
      because it is absent until the user creates or joins an organization; every organization endpoint checks
      for it and answers 403 `ORG_REQUIRED` when it is missing, and the membership row for `(sub, org)` must exist
      (otherwise 401). The `jti` of a refresh token is its server-side identifier; the `jti` of an access token is unused.
    - **CSRF guard on cookie endpoints** (`/auth/refresh`, `/auth/logout`): the request must carry the header
      `X-Requested-With: feedback-board` and, when an `Origin` header is present, it must equal the configured
      frontend origin (exact match; **`Origin: null` is not equal and gets 403**); otherwise 403 `FORBIDDEN` and nothing
      changes. This is in addition to `SameSite=Strict`. **Order of checks on `/auth/refresh`:** the rate limiter
      runs first (429, every request counts, so a request the CSRF guard then rejects with 403 still uses up the client IP's
      quota; accepted risk R10, ADR-004), then the CSRF guard (`X-Requested-With` and `Origin`, 403), then the cookie logic.
      `/auth/logout` has no rate limit: CSRF guard, then the logout logic.
    - **Content-Type and `Vary` (ADR-004, security-bot N13):** a request with a body must send `Content-Type: application/json`, otherwise
      the answer is 415 with the standard error body (`VALIDATION_ERROR`) and nothing changes (not listed per operation, like nginx's 413).
      The responses of `/auth/refresh` and `/auth/logout` send `Vary: Origin`.
    - **Security headers and caching (ADR-004):** **every response under `/api/v1/*`**, errors included, sends
      `Cache-Control: no-store` (the `NoStore` header is also declared explicitly on token-bearing responses); every API response also sends
      `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer` and a restrictive CSP.
    - **Logging:** request bodies of `/auth/*` and `/invites/*`, and the `Authorization`, `Cookie` and
      `Set-Cookie` headers, are never logged; 400 `details` never echo submitted values (field and rule only).
    - **ASSUMED (not in the stories):** users who have no organization yet (just signed up) may call only:
      auth endpoints, `POST /organizations`, `POST /invites/accept`, `POST /invites/preview`.
      Every other endpoint returns 403 `ORG_REQUIRED` for them. The 401 rule above is also ASSUMED.
    - **Invite token handling (ADR-003):** the invite token is a bearer secret and **never appears in a path or
      query string**. The shareable link is `<frontend-origin>/join#<token>` (URL fragment, never sent to a
      server); the SPA sends the token in a POST body to `POST /invites/preview` and `POST /invites/accept`.
      Invite responses are `Cache-Control: no-store`. A malformed token (wrong length or characters) is answered
      with 404 `INVITE_NOT_FOUND`, the same as an unknown token (any string of any length; there is no length limit on the token). A body without a `token` field, with a non-string `token`, or with any extra field (`additionalProperties: false`) is answered with 400 `VALIDATION_ERROR`. The same 404 is answered for a token
      that was valid under an earlier `INVITE_TOKEN_KEY` (key rotation). **Key rotation:** `POST /organizations/current/invite`
      re-derives the token with the current key and, when its SHA-256 differs from the stored hash, stores the new
      hash first, so the link it returns is the one that works and links of the old key stop working (ADR-003).
    - **Extras beyond the stories/brief:** `POST /auth/refresh` and `POST /auth/logout` go beyond story F1-1
      (F1-1 lists logout and session expiry as out of scope). They are approved per Orchestrator message 2026-10-27, relayed from the human, so they are not ASSUMED
      any more, but they are not mapped to a story either (`x-features: []`, `x-extra: true`).
      `display_name` is required at signup: approved per Orchestrator message 2026-10-27, relayed from the human; ba-bot will update the stories to match.
      Rate limiting (429) is approved per Orchestrator message 2026-10-27, relayed from the human, for signup, login, refresh and invite preview/accept (**not** for logout);
      the threshold is ASSUMED in the brief and the stories at **10 requests per rolling 60 seconds per client IP per
      endpoint** (counted whether or not the request succeeds) and is configurable by environment variables (ADR-002).
      There is no per-account login limit and no account lockout: per-account lockout is out of scope (story F1-2) and is not offered.
      `POST /organizations` also has a per-user limit (429, default 10 per 60 s), an architect addition from the
      security review (finding 5) accepted by the Orchestrator; drop it if it is out of scope.
servers:
  - url: /api/v1
    description: Relative to the site origin. In docker compose the frontend proxies /api to the backend (http://localhost:8000 when called directly).
tags:
  - name: Auth
    description: Sign up, log in, current user (F1). Token refresh and logout are approved extras beyond F1-1.
  - name: Organizations
    description: Create the organization and read the current one (F2).
  - name: Invites
    description: Shareable invite link (token in the URL fragment), preview and accept via POST body (F2, F3).
  - name: Posts
    description: Create, list and filter the board, change status, delete (F4, F7, F8, F9).
  - name: Votes
    description: One upvote per user per post (F5).
  - name: Comments
    description: List and create comments on a post (F6).
security:
  - bearerAuth: []
paths:
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Sign up with email and password
      description: Creates a user with no organization. Returns an access token (no `org` claim yet) and sets the refresh cookie (starts a new refresh-token family). Rate limited per IP (429, approved, default 10 requests per 60 seconds, ASSUMED). If the user already has 10 active sessions the oldest is revoked (see conventions). `409 EMAIL_TAKEN` is required by story F1-1 and is an account-enumeration oracle; the rate limit is the mitigation (ADR-004).
      x-features: [F1]
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
            example: { email: ana@example.com, password: correct-horse-battery, display_name: Ana }
      responses:
        '201':
          description: User created and signed in.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                token_type: bearer
                expires_in: 900
                user: { id: 0192f1c0-0000-7000-8000-000000000001, email: ana@example.com, display_name: Ana }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: Always answers `INVALID_CREDENTIALS` (401, message exactly `Invalid email or password`) for a wrong password or unknown email. Sets the refresh cookie and starts a new refresh-token family (the oldest of 10 active sessions is revoked, ASSUMED). Rate limited per IP only (429, approved, default 10 requests per 60 seconds, ASSUMED); there is no per-account limit or lockout (per-account lockout is out of scope and not offered). The access token carries `org` if the user belongs to an organization.
      x-features: [F1]
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: ana@example.com, password: correct-horse-battery }
      responses:
        '200':
          description: Signed in.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                token_type: bearer
                expires_in: 900
                user: { id: 0192f1c0-0000-7000-8000-000000000001, email: ana@example.com, display_name: Ana }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh cookie and get a new access token
      description: |
        **EXTRA, beyond story F1-1** (F1-1 puts session expiry out of scope); approved per Orchestrator message 2026-10-27, relayed from the human.
        Reads the `refresh_token` cookie (no request body) and, in one database transaction:
        1. verifies the JWT (`typ=refresh`) and finds the stored hash of its `jti` in `refresh_tokens`;
        2. rejects (401) a token that is expired or whose family is past the **absolute cap of 7 days from login** (checked first, exactly, no clock leeway);
        3. **reuse detection:** if that token was already revoked, the **whole token family is revoked** (none left active if it is already dead)
           and the answer is 401. A token revoked with reason `rotated` less than `REFRESH_REUSE_LEEWAY_SECONDS` (default 10) ago
           answers 401 without revoking the family, to tolerate two tabs racing (the SPA also takes a cross-tab lock so
           normally only one refresh runs). A token revoked by logout, eviction or reuse detection is never inside that leeway;
        4. otherwise issues a new refresh token in the same family (expiry = login time + 7 days, never later),
           marks the old one as rotated, and returns a new access token whose `org` claim is re-read from the
           database (membership), not copied from the old token.
        401 if the cookie is missing, invalid, expired, revoked or reused. **Cookie rule on the 401 (the same case list as ADR-002, ADR-004 and data-model.md section 3.8):** a 401 from `/auth/refresh` sends **no `Set-Cookie` in exactly one case**: the presented token's own row has `revoked_reason = 'rotated'` and `revoked_at` is **less than** `REFRESH_REUSE_LEEWAY_SECONDS` (default 10) ago; nothing is changed (two tabs racing, the winning tab's new cookie must survive). **Every other 401 clears the cookie** (`Set-Cookie: refresh_token=; Max-Age=0`): (a) the cookie is missing, or its JWT is invalid, has the wrong `typ` or is expired; (b) there is no row for the token, or its `expires_at` has passed (the 7-day cap included); (c) `revoked_reason = 'rotated'` and `revoked_at` is 10 s or more ago: reuse, every active row of the family is revoked with `reuse_detected` (none if the family is already dead); (d) any other `revoked_reason` (`logout`, `evicted`, `reuse_detected`), **at any time, including within 10 s of `revoked_at`**: the leeway does not apply to it, so it is treated as reuse of a dead family and the answer is 401 with the cookie cleared (the family is already revoked, nothing else changes).
        401 is also answered when the session was evicted by the 10-session cap. Requires the CSRF guard header (see conventions). Rate limited per IP (429, approved, default 10 per 60 s, ASSUMED); the limit is checked before the guard (so a request rejected by the guard still counts, risk R10). **A 429 here means "try again after `Retry-After`"; the SPA must not treat it as a logged-out session** (the cookie is untouched by a 429).
      x-extra: true
      x-features: []
      x-roles: [public]
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfGuard'
      responses:
        '200':
          description: New access token issued, refresh cookie rotated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                token_type: bearer
                expires_in: 900
                user: { id: 0192f1c0-0000-7000-8000-000000000001, email: ana@example.com, display_name: Ana }
        '401':
          description: '401 Cookie missing, invalid, expired, revoked, evicted or reused (`UNAUTHENTICATED`). Sends `Set-Cookie: refresh_token=; Max-Age=0` (the `CookieCleared` format) in every case except one: the token row has `revoked_reason = rotated` and `revoked_at` less than `REFRESH_REUSE_LEEWAY_SECONDS` ago, which has **no `Set-Cookie` header** and changes nothing. A token revoked by logout or eviction, even a moment ago, is not covered by the leeway and clears the cookie.'
          headers:
            WWW-Authenticate:
              schema: { type: string }
              description: Bearer
            Set-Cookie: { $ref: '#/components/headers/CookieCleared' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: UNAUTHENTICATED, message: Authentication required., details: [] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out (revokes the refresh-token family and clears the cookie)
      description: |
        **EXTRA, beyond story F1-1** (F1-1 puts logout out of scope); approved per Orchestrator message 2026-10-27, relayed from the human.
        If the cookie holds a known refresh token, the **whole token family is revoked on the server**
        (`revoked_reason = logout`), so a stolen copy of that cookie stops working; the cookie is then cleared.
        Idempotent: without a cookie, or with an unknown or already revoked one, it still answers 204. It is serialised with a concurrent refresh of the same family, so after a 204 no token of the family is live.
        An access token that was already issued stays valid until it expires (at most 15 min 30 s: 15 min plus the 30 s JWT leeway), see ADR-002.
        Requires the CSRF guard header (see conventions). Not rate limited: the approved rate-limit scope is
        signup, login, refresh and invite preview/accept.
      x-extra: true
      x-features: []
      x-roles: [public]
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfGuard'
      responses:
        '204':
          description: Family revoked (if any) and cookie cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookieCleared' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user, organization and role
      description: '`organization` and `role` are `null` for a user who has no organization yet.'
      x-features: [F1, F2]
      x-roles: [admin, member, no-organization]
      responses:
        '200':
          description: The signed-in user.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                user: { id: 0192f1c0-0000-7000-8000-000000000001, email: ana@example.com, display_name: Ana }
                organization: { id: 0192f1c0-0000-7000-8000-0000000000a1, name: Platform Team, created_at: '2026-10-27T18:30:00Z' }
                role: admin
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization and become its admin
      description: |
        Allowed only for a user without an organization (one organization per user in the MVP);
        otherwise 409 `ALREADY_IN_ORGANIZATION`. The response contains a **new access token that
        includes the `org` claim**; the refresh cookie is not rotated (the `org` claim is re-read from the database on every refresh). The client must replace its access token. Per-user rate limit (429, architect addition, default 10 per 60 s, ASSUMED).
      x-features: [F2]
      x-roles: [no-organization]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
            example: { name: Platform Team }
      responses:
        '201':
          description: Organization created; caller is admin.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSession' }
              example:
                organization: { id: 0192f1c0-0000-7000-8000-0000000000a1, name: Platform Team, created_at: '2026-10-27T18:30:00Z' }
                role: admin
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                token_type: bearer
                expires_in: 900
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /organizations/current:
    get:
      tags: [Organizations]
      operationId: getCurrentOrganization
      summary: Get the caller's organization
      description: The organization is the one in the token; there is no organization id in the path.
      x-features: [F2]
      x-roles: [admin, member]
      responses:
        '200':
          description: The current organization.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDetail' }
              example:
                id: 0192f1c0-0000-7000-8000-0000000000a1
                name: Platform Team
                created_at: '2026-10-27T18:30:00Z'
                member_count: 3
                role: admin
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /organizations/current/invite:
    post:
      tags: [Invites]
      operationId: getOrCreateInvite
      summary: Get (or create on first use) the organization's single invite token
      description: |
        Admin only. Each organization has exactly **one** persistent invite token (story F3-1, Orchestrator
        decision). The first call creates it (still answered 200); every later call by any admin of the
        organization returns the **same** token, and never creates a second one. The token is long
        and unpredictable (32 bytes, URL-safe base64, 43 characters) and valid for exactly one organization.
        Revocation and regeneration are not in the MVP. The frontend builds the link as `<frontend-origin>/join#<token>` (fragment, ADR-003).
        The token is derived server-side (HMAC of the organization id and a token version with a server key) and only its SHA-256 hash is stored, so it can be shown again without keeping it in clear (ADR-003). If the server key was rotated, the call stores the new hash and returns the new token, and links of the old key stop working (the old token gives 404 INVITE_NOT_FOUND).
        Members get 403 and no token is created; no token gives 401.
      x-features: [F3]
      x-roles: [admin]
      responses:
        '200':
          description: The organization's invite token.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
              example:
                token: PNqzMLttQPIF8nHKGWLPGIMzyUHw8lLpXulro9uECFo
                created_at: '2026-10-27T18:35:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invites/preview:
    post:
      tags: [Invites]
      operationId: previewInvite
      summary: Preview an invite (public)
      description: |
        Public, so the invited person can see which organization they would join before signing up.
        The token is sent in the **request body**, never in the path or query (ADR-003). Returns only the
        organization name. An unknown or malformed token string (any length) returns 404 `INVITE_NOT_FOUND` (message
        `Invite link is invalid`); a missing or non-string `token` field, or any extra field in the body (`additionalProperties: false`), returns 400 `VALIDATION_ERROR`. No side effects (POST only to keep the token out of the URL). Order of checks: 429, 400, 404.
        Rate limited per IP (429, approved, default 10 per 60 s, ASSUMED), counted for any token valid or not. `Cache-Control: no-store`.
      x-features: [F2, F3]
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteTokenRequest' }
            example: { token: PNqzMLttQPIF8nHKGWLPGIMzyUHw8lLpXulro9uECFo }
      responses:
        '200':
          description: Invite is valid.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
              example: { organization_name: Platform Team }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invites/accept:
    post:
      tags: [Invites]
      operationId: acceptInvite
      summary: Join the organization behind an invite as a member
      description: |
        For a signed-in user without an organization. The token is sent in the **request body**, never in the
        path or query (ADR-003). Creates a `member` membership. The invite is not consumed. Returns a **new access
        token with the `org` claim**; the refresh cookie is not rotated. 409 `ALREADY_IN_ORGANIZATION` if the user
        already belongs to an organization; 404 `INVITE_NOT_FOUND` for an unknown or malformed token string; 400 `VALIDATION_ERROR` for a missing or non-string `token` field or any extra field in the body (`additionalProperties: false`).
        Rate limited per IP (429, approved, default 10 per 60 s, ASSUMED), checked before authentication, so every attempt counts. **Order of checks: 429 (limiter), then 401 (access token), then 400 (body shape), then the token lookup (404), then the membership check (409).** `Cache-Control: no-store`.
      x-features: [F2, F3]
      x-roles: [no-organization]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteTokenRequest' }
            example: { token: PNqzMLttQPIF8nHKGWLPGIMzyUHw8lLpXulro9uECFo }
      responses:
        '200':
          description: Joined the organization.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSession' }
              example:
                organization: { id: 0192f1c0-0000-7000-8000-0000000000a1, name: Platform Team, created_at: '2026-10-27T18:30:00Z' }
                role: member
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                token_type: bearer
                expires_in: 900
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /posts:
    get:
      tags: [Posts]
      operationId: listPosts
      summary: List posts of the caller's organization, most votes first
      description: |
        Sorted by `vote_count` descending, then `created_at` descending (newest first), then `id` descending
        (stable order). Optional filters `type` and `status` combine with AND; a value outside the
        allowed lists is rejected with 400 `VALIDATION_ERROR` (story F7-1). All matching posts are
        returned in one response (no pagination in the MVP). An empty board returns `items: []`.
      x-features: [F7]
      x-roles: [admin, member]
      parameters:
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PostType' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PostStatus' }
      responses:
        '200':
          description: All matching posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
              example:
                items:
                  - id: 0192f1c0-0000-7000-8000-0000000000c1
                    title: Dark mode
                    description: Please add a dark theme.
                    type: idea
                    status: Planned
                    vote_count: 7
                    comment_count: 2
                    has_voted: true
                    author: { id: 0192f1c0-0000-7000-8000-000000000001, display_name: Ana }
                    created_at: '2026-10-27T18:40:00Z'
                    updated_at: '2026-10-27T19:00:00Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Posts]
      operationId: createPost
      summary: Create a post
      description: Status starts as `New`. The author is the caller and the organization is the one in the token.
      x-features: [F4]
      x-roles: [admin, member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
            example: { title: Dark mode, description: Please add a dark theme., type: idea }
      responses:
        '201':
          description: Post created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
              example:
                id: 0192f1c0-0000-7000-8000-0000000000c1
                title: Dark mode
                description: Please add a dark theme.
                type: idea
                status: New
                vote_count: 0
                comment_count: 0
                has_voted: false
                author: { id: 0192f1c0-0000-7000-8000-000000000001, display_name: Ana }
                created_at: '2026-10-27T18:40:00Z'
                updated_at: '2026-10-27T18:40:00Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /posts/{post_id}:
    get:
      tags: [Posts]
      operationId: getPost
      summary: Get one post
      description: 404 `POST_NOT_FOUND` if the post does not exist **or belongs to another organization**.
      x-features: [F4, F7]
      x-roles: [admin, member]
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
              example:
                id: 0192f1c0-0000-7000-8000-0000000000c1
                title: Dark mode
                description: Please add a dark theme.
                type: idea
                status: Planned
                vote_count: 7
                comment_count: 2
                has_voted: true
                author: { id: 0192f1c0-0000-7000-8000-000000000001, display_name: Ana }
                created_at: '2026-10-27T18:40:00Z'
                updated_at: '2026-10-27T19:00:00Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Posts]
      operationId: deletePost
      summary: Delete a post (admin only)
      description: Hard delete; its votes and comments are deleted with it. A member gets 403 `FORBIDDEN`; a post of another organization gets 404 `POST_NOT_FOUND` (checked before the role, so existence is never revealed across organizations).
      x-features: [F9]
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/{post_id}/status:
    patch:
      tags: [Posts]
      operationId: updatePostStatus
      summary: Change a post's status (admin only)
      description: An admin may set any of the four statuses in any direction (ASSUMED in brief). Setting the current status again is a no-op that returns 200.
      x-features: [F8]
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePostStatusRequest' }
            example: { status: In Progress }
      responses:
        '200':
          description: Updated post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
              example:
                id: 0192f1c0-0000-7000-8000-0000000000c1
                title: Dark mode
                description: Please add a dark theme.
                type: idea
                status: In Progress
                vote_count: 7
                comment_count: 2
                has_voted: true
                author: { id: 0192f1c0-0000-7000-8000-000000000001, display_name: Ana }
                created_at: '2026-10-27T18:40:00Z'
                updated_at: '2026-10-27T19:10:00Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/{post_id}/vote:
    post:
      tags: [Votes]
      operationId: toggleVote
      summary: Toggle the caller's upvote on a post
      description: |
        Story F5-1: a first call adds the caller's vote; a second call by the same user removes it
        (so a repeated identical request toggles, it never creates a second vote). The caller can
        never have more than one vote per post: `UNIQUE (user_id, post_id)` in the database, with
        the insert/delete and the `vote_count` update in one transaction. Concurrent double clicks
        must not produce a 500: a unique violation is treated as "already voted" and resolved to
        the toggle result. Always returns 200 with the resulting state. A post in another
        organization (or a missing post) returns 404 `POST_NOT_FOUND` and changes nothing.
      x-features: [F5]
      x-roles: [admin, member]
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Vote state after the call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteState' }
              example: { post_id: 0192f1c0-0000-7000-8000-0000000000c1, vote_count: 8, has_voted: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/{post_id}/comments:
    get:
      tags: [Comments]
      operationId: listComments
      summary: List comments of a post, oldest first
      description: Ordered by `created_at` ascending, then `id` ascending. 404 `POST_NOT_FOUND` if the post is missing or in another organization.
      x-features: [F6]
      x-roles: [admin, member]
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: All comments of the post, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
              example:
                items:
                  - id: 0192f1c0-0000-7000-8000-0000000000d1
                    post_id: 0192f1c0-0000-7000-8000-0000000000c1
                    body: Would love this too.
                    author: { id: 0192f1c0-0000-7000-8000-000000000002, display_name: Ben }
                    created_at: '2026-10-27T18:50:00Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      operationId: createComment
      summary: Comment on a post
      x-features: [F6]
      x-roles: [admin, member]
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
            example: { body: Would love this too. }
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
              example:
                id: 0192f1c0-0000-7000-8000-0000000000d1
                post_id: 0192f1c0-0000-7000-8000-0000000000c1
                body: Would love this too.
                author: { id: 0192f1c0-0000-7000-8000-000000000002, display_name: Ben }
                created_at: '2026-10-27T18:50:00Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (HS256, 15 min, `typ=access`). Claims `sub`, `org` (absent until an organization exists), `typ`, `iat`, `exp`, `jti`, `iss`, `aud` (ADR-002).
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie (`typ=refresh`, stored server-side as a hash, rotated on use, absolute 7 days from login, Path=/api/v1/auth).
  headers:
    RefreshCookie:
      description: '`refresh_token=<jwt>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<seconds left until login time + 7 days>` (at most 604800). `Secure` may be off only when `APP_ENV` is not `production`.'
      schema:
        type: string
    NoStore:
      description: '`no-store`. Responses carrying tokens or tenant data must not be cached.'
      schema:
        type: string
        enum: [no-store]
    CookieCleared:
      description: '`refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0`. Sent by logout (204) and by a 401 of `/auth/refresh`, except a token revoked with reason `rotated` less than `REFRESH_REUSE_LEEWAY_SECONDS` ago (no `Set-Cookie` at all).'
      schema:
        type: string
  parameters:
    PostId:
      name: post_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 0192f1c0-0000-7000-8000-0000000000c1
    CsrfGuard:
      name: X-Requested-With
      in: header
      required: true
      description: Must be exactly `feedback-board` (CSRF guard for the cookie endpoints, ADR-004). A missing or wrong value, or a different `Origin`, gives 403 `FORBIDDEN`.
      schema: { type: string, enum: [feedback-board] }
  responses:
    ValidationError:
      description: 400 Request failed validation (bad body, query or path).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed.
              details:
                - { field: title, message: 'String should have at most 120 characters' }
    Unauthorized:
      description: '401 (**ASSUMED**, see conventions) Missing, invalid or expired token, or wrong credentials (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`).'
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: Bearer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: UNAUTHENTICATED, message: Authentication required., details: [] }
    Forbidden:
      description: '403 Caller is authenticated but not allowed (`FORBIDDEN` wrong role, or a failed CSRF guard on `/auth/refresh` and `/auth/logout`; `ORG_REQUIRED` no organization yet, **ASSUMED**: no story or brief text defines it).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: FORBIDDEN, message: Admin role required., details: [] }
    NotFound:
      description: 404 Resource does not exist **or belongs to another organization** (`POST_NOT_FOUND`, `INVITE_NOT_FOUND`). The two cases are indistinguishable. For an invite the message is `Invite link is invalid` (story F2-1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: POST_NOT_FOUND, message: Post not found., details: [] }
    Conflict:
      description: 409 State conflict (`EMAIL_TAKEN` with message `Email already registered`; `ALREADY_IN_ORGANIZATION` with message `You already belong to an organization`, for creating or joining an organization when the user already has one, story F2-1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: EMAIL_TAKEN, message: Email already registered, details: [] }
    RateLimited:
      description: '429 Too many requests (`RATE_LIMITED`). Rate limiting is approved per Orchestrator message 2026-10-27, relayed from the human. Applied per client IP (default 10 requests per rolling 60 seconds per endpoint, ASSUMED in the brief and stories F1-2 and F3-1) to signup, login, refresh, invite preview and invite accept, and per user (default 10 per 60 s) to organization create; **not** to logout, and there is no per-account login limit or lockout (out of scope, not offered). Configurable by environment variables (ADR-002).'
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Whole seconds to wait, at least 1.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: RATE_LIMITED, message: Too many requests. Try again later., details: [] }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - ORG_REQUIRED
                - POST_NOT_FOUND
                - INVITE_NOT_FOUND
                - EMAIL_TAKEN
                - ALREADY_IN_ORGANIZATION
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    PostType:
      type: string
      enum: [idea, bug]
    PostStatus:
      type: string
      enum: [New, Planned, In Progress, Done]
    Role:
      type: string
      enum: [admin, member]
    UserPublic:
      type: object
      description: Minimal author info shown to members of the same organization. Never includes email.
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    User:
      type: object
      description: The caller's own account (includes email; returned only to the owner).
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    SignupRequest:
      type: object
      required: [email, password, display_name]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        display_name: { type: string, minLength: 1, maxLength: 80, description: 'Trim leading and trailing whitespace first, then validate the length 1-80; the trimmed value is stored.' }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 1, maxLength: 128 }
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, description: Seconds until the access token expires (900). }
        user: { $ref: '#/components/schemas/User' }
    Organization:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        created_at: { type: string, format: date-time }
    OrganizationDetail:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required: [member_count, role]
          properties:
            member_count: { type: integer, minimum: 1 }
            role: { $ref: '#/components/schemas/Role' }
    CreateOrganizationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    OrganizationSession:
      type: object
      description: Result of creating or joining an organization. Contains a new access token that carries the `org` claim.
      required: [organization, role, access_token, token_type, expires_in]
      properties:
        organization: { $ref: '#/components/schemas/Organization' }
        role: { $ref: '#/components/schemas/Role' }
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer }
    Me:
      type: object
      required: [user, organization, role]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organization:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Organization'
        role:
          type: string
          nullable: true
          enum: [admin, member, null]
          description: '`null` while the user has no organization.'
    Invite:
      type: object
      required: [token, created_at]
      properties:
        token: { type: string, description: 'The organization''s single persistent invite token. Secret: never log it. Only its hash is stored (ADR-003).', minLength: 32, maxLength: 128 }
        created_at: { type: string, format: date-time }
    InviteTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: 'The invite token from the URL fragment (43 characters when valid). Secret: never log it. No length limit is declared on purpose: any string that is not a valid current token, of any length, gives 404 INVITE_NOT_FOUND, not 400 (a missing or non-string token field, or any extra field in the body, gives 400 VALIDATION_ERROR; a body over the nginx limit gives 413 from nginx, ADR-004 section 7).' }
    InvitePreview:
      type: object
      required: [organization_name]
      properties:
        organization_name: { type: string }
    CreatePostRequest:
      type: object
      required: [title, description, type]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        type: { $ref: '#/components/schemas/PostType' }
    UpdatePostStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/PostStatus' }
    Post:
      type: object
      required: [id, title, description, type, status, vote_count, comment_count, has_voted, author, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        type: { $ref: '#/components/schemas/PostType' }
        status: { $ref: '#/components/schemas/PostStatus' }
        vote_count: { type: integer, minimum: 0 }
        comment_count: { type: integer, minimum: 0 }
        has_voted: { type: boolean, description: Whether the caller has upvoted this post. }
        author: { $ref: '#/components/schemas/UserPublic' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PostPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Post' }
    VoteState:
      type: object
      required: [post_id, vote_count, has_voted]
      properties:
        post_id: { type: string, format: uuid }
        vote_count: { type: integer, minimum: 0 }
        has_voted: { type: boolean }
    CreateCommentRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
    Comment:
      type: object
      required: [id, post_id, body, author, created_at]
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        body: { type: string, minLength: 1, maxLength: 1000 }
        author: { $ref: '#/components/schemas/UserPublic' }
        created_at: { type: string, format: date-time }
    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
