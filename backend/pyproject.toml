# Versions are the compatible-release pins from docs/project/stack.md
# (backend table and the attempt-2 tooling addendum). Do not bump a pin without an ADR.

[project]
name = "feedback-board"
version = "0.1.0"
description = "Team Feedback Board API"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "alembic~=1.20.1",
    "argon2-cffi~=25.1.0",
    "email-validator~=2.3.0",
    "fastapi~=0.162.0",
    "psycopg[binary]~=3.3.6",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.16.1",
    "pyjwt~=2.15.1",
    "sqlalchemy~=2.1.6",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "mypy~=2.4.0",
    "pytest~=9.2.0",
    "ruff~=0.17.3",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["feedback_board", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["feedback_board", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["feedback_board", "tests"]
mypy_path = "."
warn_unused_ignores = true
pretty = true
